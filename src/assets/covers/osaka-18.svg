  <!-- ground -->
  <rect x="0" y="270" width="640" height="90" fill="#6E7687"/>
  <rect x="0" y="266" width="640" height="8" fill="#9AA3B2"/>
  <g fill="#8E97A8" opacity="0.7"><ellipse cx="200" cy="310" rx="50" ry="6"/><ellipse cx="470" cy="330" rx="60" ry="6"/></g>
  <!-- first-aid kit -->
  <g transform="translate(70 160)">
    <rect x="30" y="-16" width="40" height="20" rx="6" fill="none" stroke="#C8CED8" stroke-width="6"/>
    <rect x="0" y="0" width="100" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="40" y="16" width="20" height="48" rx="3" fill="#E5394A"/>
    <rect x="26" y="30" width="48" height="20" rx="3" fill="#E5394A"/>
  </g>
  <!-- umbrella -->
  <g transform="translate(500 120)">
    <path d="M-70 60 Q-70 0 0 -6 Q70 0 70 60 Q52 48 35 60 Q18 48 0 60 Q-18 48 -35 60 Q-52 48 -70 60 Z" fill="#2FA84F"/>
    <path d="M-35 60 Q-30 20 0 -6 Q30 20 35 60" fill="none" stroke="#1E7A3A" stroke-width="2"/>
    <rect x="-3" y="-18" width="6" height="14" rx="3" fill="#3D4B66"/>
    <path d="M0 60 V130 Q0 146 -14 146 Q-26 146 -26 134" fill="none" stroke="#3D4B66" stroke-width="6" stroke-linecap="round"/>
