<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="o18-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E6E8E"/>
      <stop offset="1" stop-color="#B3BED2"/>
    </linearGradient>
    <radialGradient id="o18-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B5C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FF6B5C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#o18-sky)"/>
  <!-- rain -->
  <g stroke="#E6ECF5" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <path d="M40 30 l-8 18 M110 60 l-8 18 M180 20 l-8 18 M420 40 l-8 18 M500 70 l-8 18 M590 30 l-8 18 M560 130 l-8 18 M60 130 l-8 18 M140 170 l-8 18 M610 200 l-8 18"/>
  </g>
  <!-- koban -->
  <g>
    <circle cx="320" cy="62" r="46" fill="url(#o18-lamp)"/>
    <rect x="312" y="50" width="16" height="22" rx="4" fill="#E5171F"/>
    <path d="M220 84 L320 60 L420 84 Z" fill="#3D4B66"/>
    <rect x="220" y="84" width="200" height="12" fill="#2B364C"/>
    <rect x="232" y="96" width="176" height="174" fill="#E9E4D8"/>
    <rect x="232" y="106" width="176" height="20" fill="#2F4A7A"/>
    <circle cx="320" cy="116" r="6" fill="#E8C66A"/>
    <rect x="290" y="150" width="60" height="120" fill="#BFD4EA"/>
    <rect x="319" y="150" width="2" height="120" fill="#8AA2BF"/>
    <rect x="246" y="150" width="30" height="40" fill="#BFD4EA"/>
    <rect x="364" y="150" width="30" height="40" fill="#BFD4EA"/>
