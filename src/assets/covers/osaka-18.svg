    <path d="M0 -26 L28 22 H-28 Z" fill="#F5C842"/>
    <rect x="-3" y="-10" width="6" height="18" rx="3" fill="#3D2A10"/>
    <circle cx="0" cy="14" r="3.5" fill="#3D2A10"/>
