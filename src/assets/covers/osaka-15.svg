<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="o15-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EC9FF"/>
      <stop offset="1" stop-color="#FFE6EE"/>
    </linearGradient>
    <linearGradient id="o15-cam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5874"/>
      <stop offset="1" stop-color="#2B364C"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#o15-sky)"/>
  <g fill="#FFFFFF" opacity="0.8"><ellipse cx="480" cy="60" rx="50" ry="14"/><ellipse cx="506" cy="50" rx="28" ry="14"/></g>
  <!-- skyline -->
  <g fill="#A9C1E4">
    <rect x="140" y="180" width="50" height="100"/><rect x="196" y="150" width="40" height="130"/><rect x="380" y="170" width="44" height="110"/><rect x="430" y="196" width="60" height="84"/>
  </g>
  <!-- twin-building observatory -->
  <g fill="#7B93C9">
    <rect x="250" y="70" width="40" height="210"/>
    <rect x="320" y="70" width="40" height="210"/>
    <rect x="246" y="60" width="118" height="22" rx="4"/>
  </g>
  <circle cx="305" cy="71" r="16" fill="#BFE0F5"/>
  <g fill="#DCE8F8" opacity="0.8">
    <rect x="258" y="96" width="24" height="6"/><rect x="258" y="116" width="24" height="6"/><rect x="258" y="136" width="24" height="6"/><rect x="258" y="156" width="24" height="6"/><rect x="258" y="176" width="24" height="6"/>
    <rect x="328" y="96" width="24" height="6"/><rect x="328" y="116" width="24" height="6"/><rect x="328" y="136" width="24" height="6"/><rect x="328" y="156" width="24" height="6"/><rect x="328" y="176" width="24" height="6"/>
  </g>
  <!-- ground -->
  <rect x="0" y="280" width="640" height="80" fill="#9CC983"/>
  <!-- cherry tree -->
  <g>
    <path d="M90 300 Q94 220 70 180 M92 240 Q110 210 130 200" fill="none" stroke="#6B4A2F" stroke-width="12" stroke-linecap="round"/>
    <g fill="#FFB7C9">
      <circle cx="60" cy="150" r="44"/><circle cx="110" cy="130" r="40"/><circle cx="140" cy="180" r="34"/><circle cx="30" cy="190" r="30"/><circle cx="96" cy="190" r="30"/>
    </g>
    <g fill="#FFD6E2"><circle cx="70" cy="140" r="16"/><circle cx="120" cy="124" r="12"/><circle cx="140" cy="176" r="10"/></g>
  </g>
  <!-- falling petals -->
  <g fill="#FF9FB8">
    <ellipse cx="200" cy="230" rx="6" ry="4" transform="rotate(30 200 230)"/>
    <ellipse cx="230" cy="110" rx="6" ry="4" transform="rotate(-20 230 110)"/>
    <ellipse cx="380" cy="130" rx="6" ry="4" transform="rotate(40 380 130)"/>
    <ellipse cx="170" cy="70" rx="5" ry="3"/>
    <ellipse cx="560" cy="160" rx="6" ry="4" transform="rotate(20 560 160)"/>
  </g>
  <!-- camera -->
  <g transform="translate(470 196)">
    <rect x="20" y="-14" width="40" height="20" rx="4" fill="#3D4B66"/>
    <rect x="0" y="0" width="140" height="92" rx="14" fill="url(#o15-cam)"/>
    <rect x="0" y="24" width="140" height="14" fill="#C9813A"/>
    <circle cx="70" cy="50" r="32" fill="#1B2333"/>
    <circle cx="70" cy="50" r="22" fill="#5A7FB0"/>
    <circle cx="62" cy="42" r="7" fill="#BFE0F5"/>
    <circle cx="118" cy="14" r="6" fill="#F5C842"/>
    <rect x="94" y="-8" width="24" height="10" rx="3" fill="#E5394A"/>
  </g>
</svg>
