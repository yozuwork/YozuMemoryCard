  </defs>
  <rect width="640" height="360" fill="url(#o13-sky)"/>
  <circle cx="110" cy="70" r="20" fill="#FFF4CC" opacity="0.9"/>
  <g fill="#FFFFFF" opacity="0.7"><circle cx="200" cy="40" r="1.6"/><circle cx="520" cy="30" r="1.6"/><circle cx="600" cy="70" r="1.4"/></g>
  <!-- background towers -->
  <g fill="#5A4A78" opacity="0.8">
