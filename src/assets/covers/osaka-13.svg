  <!-- bellhop bell -->
  <g transform="translate(110 150)">
    <path d="M0 40 A36 36 0 0 1 72 40 Z" fill="#E8C66A"/>
    <rect x="-6" y="40" width="84" height="8" rx="3" fill="#B88A2A"/>
