    <rect x="560" y="150" width="70" height="130"/>
  </g>
  <!-- hotel -->
  <rect x="190" y="50" width="200" height="230" fill="#4A4F7A"/>
  <rect x="180" y="40" width="220" height="16" fill="#353A60"/>
  <g fill="#FFD27A">
    <rect x="208" y="72" width="26" height="20"/><rect x="246" y="72" width="26" height="20" opacity="0.4"/><rect x="284" y="72" width="26" height="20"/><rect x="322" y="72" width="26" height="20"/><rect x="360" y="72" width="16" height="20" opacity="0.4"/>
    <rect x="208" y="108" width="26" height="20" opacity="0.4"/><rect x="246" y="108" width="26" height="20"/><rect x="284" y="108" width="26" height="20"/><rect x="322" y="108" width="26" height="20" opacity="0.4"/><rect x="360" y="108" width="16" height="20"/>
    <rect x="208" y="144" width="26" height="20"/><rect x="246" y="144" width="26" height="20"/><rect x="284" y="144" width="26" height="20" opacity="0.4"/><rect x="322" y="144" width="26" height="20"/><rect x="360" y="144" width="16" height="20"/>
    <rect x="208" y="180" width="26" height="20"/><rect x="246" y="180" width="26" height="20" opacity="0.4"/><rect x="284" y="180" width="26" height="20"/><rect x="322" y="180" width="26" height="20"/><rect x="360" y="180" width="16" height="20" opacity="0.4"/>
  </g>
  <rect x="236" y="220" width="108" height="10" fill="#C9A24A"/>
  <rect x="256" y="230" width="68" height="50" fill="#FFE2A8"/>
  <rect x="289" y="230" width="2" height="50" fill="#C9A24A"/>
  <!-- ground -->
  <rect x="0" y="280" width="640" height="80" fill="#3B3256"/>
  <!-- bed -->
  <g transform="translate(410 176)">
    <rect x="0" y="0" width="14" height="110" rx="4" fill="#8B5A2B"/>
    <rect x="10" y="50" width="200" height="40" rx="8" fill="#FFFFFF"/>
    <rect x="80" y="44" width="130" height="46" rx="8" fill="#7FB0E0"/>
    <rect x="80" y="44" width="130" height="10" rx="5" fill="#A9CCEE"/>
    <ellipse cx="44" cy="44" rx="30" ry="14" fill="#F4F7FB"/>
    <rect x="10" y="88" width="200" height="16" rx="4" fill="#A8713A"/>
    <rect x="196" y="60" width="14" height="50" rx="4" fill="#8B5A2B"/>
