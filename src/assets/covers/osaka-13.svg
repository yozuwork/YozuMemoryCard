    <rect x="50" y="232" width="130" height="10" fill="#C9A24A"/>
    <circle cx="150" cy="268" r="12" fill="none" stroke="#C9A24A" stroke-width="3"/>
    <rect x="66" y="260" width="50" height="8" rx="4" fill="#8A97AD"/>
