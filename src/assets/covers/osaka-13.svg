<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="o13-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F7A"/>
      <stop offset="0.6" stop-color="#C77A9A"/>
      <stop offset="1" stop-color="#FFC48A"/>
    </linearGradient>
    <linearGradient id="o13-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D4B66"/>
      <stop offset="1" stop-color="#1B2333"/>
