    <rect x="236" y="190" width="18" height="16" rx="2" fill="#F5C842"/><rect x="260" y="188" width="18" height="18" rx="2" fill="#FF8FA3"/><rect x="284" y="192" width="18" height="14" rx="2" fill="#5BC0EB"/>
