<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="o10-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E9FF"/>
      <stop offset="1" stop-color="#F2F7FF"/>
    </linearGradient>
    <linearGradient id="o10-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F6B"/>
      <stop offset="1" stop-color="#E5584A"/>
    </linearGradient>
    <linearGradient id="o10-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#D9A92A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#o10-bg)"/>
  <!-- counter -->
  <rect x="0" y="250" width="640" height="110" fill="#C99A6A"/>
  <rect x="0" y="250" width="640" height="10" fill="#DDB384"/>
  <!-- register -->
  <g transform="translate(80 70)">
    <rect x="20" y="0" width="30" height="40" fill="#5B6B88"/>
    <rect x="-10" y="-30" width="110" height="44" rx="6" fill="#2B364C"/>
    <rect x="0" y="-22" width="90" height="28" rx="4" fill="#7DDA8C"/>
    <path d="M-20 70 L10 40 H180 L210 70 Z" fill="#E6EBF2"/>
    <rect x="-20" y="70" width="230" height="110" rx="8" fill="#F4F7FB"/>
    <g fill="#9DB7DF">
      <rect x="10" y="88" width="30" height="20" rx="4"/><rect x="50" y="88" width="30" height="20" rx="4"/><rect x="90" y="88" width="30" height="20" rx="4"/>
      <rect x="10" y="116" width="30" height="20" rx="4"/><rect x="50" y="116" width="30" height="20" rx="4"/><rect x="90" y="116" width="30" height="20" rx="4"/>
    </g>
    <rect x="134" y="88" width="56" height="48" rx="6" fill="#2FA84F"/>
    <rect x="-20" y="150" width="230" height="30" rx="4" fill="#C8D2E0"/>
    <rect x="70" y="160" width="50" height="8" rx="4" fill="#8A97AD"/>
  </g>
  <!-- receipt -->
  <g transform="translate(316 70)">
    <path d="M0 0 H90 V170 L80 162 L70 170 L60 162 L50 170 L40 162 L30 170 L20 162 L10 170 L0 162 Z" fill="#FFFFFF"/>
    <g fill="#B7C0CE">
      <rect x="14" y="20" width="62" height="8" rx="4"/>
      <rect x="14" y="44" width="40" height="6" rx="3"/><rect x="62" y="44" width="14" height="6" rx="3"/>
      <rect x="14" y="62" width="34" height="6" rx="3"/><rect x="62" y="62" width="14" height="6" rx="3"/>
      <rect x="14" y="80" width="44" height="6" rx="3"/><rect x="62" y="80" width="14" height="6" rx="3"/>
    </g>
    <rect x="14" y="104" width="62" height="2" fill="#8A97AD"/>
    <rect x="14" y="116" width="30" height="10" rx="4" fill="#3D4B66"/>
    <rect x="52" y="116" width="24" height="10" rx="4" fill="#E5394A"/>
  </g>
  <!-- cash tray -->
  <g transform="translate(400 222)">
    <path d="M0 10 H200 L188 56 H12 Z" fill="#3D4B66"/>
    <rect x="0" y="4" width="200" height="12" rx="6" fill="#5B6B88"/>
    <g>
      <circle cx="60" cy="16" r="20" fill="url(#o10-coin)"/>
      <circle cx="60" cy="16" r="12" fill="none" stroke="#C99A2A" stroke-width="3"/>
      <circle cx="100" cy="8" r="18" fill="#D8DCE3"/>
      <circle cx="100" cy="8" r="5" fill="#A6AEBB"/>
      <circle cx="136" cy="18" r="16" fill="#C98A5A"/>
      <circle cx="80" cy="30" r="14" fill="#D8DCE3"/>
    </g>
  </g>
  <!-- banknote -->
  <g transform="rotate(-8 520 230)">
    <rect x="440" y="196" width="150" height="70" rx="6" fill="#C9E3C2"/>
    <circle cx="560" cy="231" r="20" fill="#A6CFA0"/>
    <rect x="456" y="210" width="60" height="8" rx="4" fill="#8DBA86"/>
  </g>
  <!-- credit card -->
  <g transform="rotate(12 510 140)">
    <rect x="430" y="90" width="160" height="100" rx="12" fill="url(#o10-card)"/>
    <rect x="430" y="110" width="160" height="18" fill="#2B364C" opacity="0.8"/>
    <rect x="448" y="142" width="32" height="24" rx="4" fill="#F5C842"/>
    <circle cx="552" cy="166" r="12" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="566" cy="166" r="12" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>
