<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="o06-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7CF"/>
      <stop offset="1" stop-color="#E9CFA8"/>
