    <ellipse cx="262" cy="188" rx="50" ry="14" fill="#F5C842"/>
    <rect x="226" y="176" width="22" height="16" rx="4" fill="#C9813A"/>
    <rect x="252" y="174" width="22" height="16" rx="4" fill="#C9813A"/>
    <rect x="278" y="176" width="22" height="16" rx="4" fill="#C9813A"/>
    <ellipse cx="310" cy="190" rx="10" ry="5" fill="#7FB547"/>
  </g>
  <path d="M196 216 Q270 232 344 216" fill="none" stroke="#F4EBDD" stroke-width="3" opacity="0.6"/>
  <!-- chopsticks -->
  <g transform="rotate(-18 390 230)">
    <rect x="360" y="226" width="130" height="7" rx="3" fill="#3E2C1E"/>
    <rect x="360" y="238" width="130" height="7" rx="3" fill="#3E2C1E"/>
