    <rect x="8" y="8" width="104" height="104" rx="4" fill="#2C3A2E"/>
    <g fill="#F4EBDD" opacity="0.85">
      <rect x="20" y="22" width="50" height="7" rx="3"/><circle cx="96" cy="25" r="5"/>
      <rect x="20" y="42" width="62" height="7" rx="3"/><circle cx="96" cy="45" r="5"/>
      <rect x="20" y="62" width="44" height="7" rx="3"/><circle cx="96" cy="65" r="5"/>
      <rect x="20" y="82" width="56" height="7" rx="3"/><circle cx="96" cy="85" r="5"/>
    </g>
  </g>
  <!-- counter -->
  <rect x="0" y="250" width="640" height="110" fill="#B07A45"/>
  <rect x="0" y="250" width="640" height="10" fill="#C99258"/>
  <!-- tray -->
  <rect x="150" y="248" width="300" height="34" rx="8" fill="#5A3A22"/>
