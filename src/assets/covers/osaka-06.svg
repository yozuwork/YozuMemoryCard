  </defs>
  <rect width="640" height="360" fill="url(#o06-bg)"/>
  <!-- wooden lattice wall -->
  <g stroke="#D8B88A" stroke-width="3" opacity="0.7">
    <path d="M40 0 V250 M100 0 V250 M540 0 V250 M600 0 V250"/>
  </g>
  <!-- noren -->
  <rect x="120" y="22" width="400" height="10" rx="5" fill="#6B4A2F"/>
