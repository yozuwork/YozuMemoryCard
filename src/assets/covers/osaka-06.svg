    <path d="M130 32 H222 V118 Q176 128 130 118 Z"/>
    <path d="M228 32 H320 V118 Q274 128 228 118 Z"/>
    <path d="M326 32 H418 V118 Q372 128 326 118 Z"/>
    <path d="M424 32 H516 V118 Q470 128 424 118 Z"/>
  </g>
  <g fill="#F4EBDD">
    <circle cx="320" cy="72" r="26"/>
  </g>
  <circle cx="320" cy="72" r="14" fill="#2E4A7A"/>
  <!-- menu board -->
  <g transform="translate(444 128)">
